# Publica el sitio estático en GitHub Pages en cada push a main (sin build).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar carpeta pública
        run: |
          mkdir _site
          cp -r index.html 404.html css js assets llms.txt robots.txt sitemap.xml site.webmanifest _site/
          # Preview para el cliente: que Google no indexe github.io (quitar cuando haya dominio propio)
          if [ "${{ vars.PUBLIC_NOINDEX || 'true' }}" = "true" ]; then
            sed -i 's|<meta name="robots" content="index, follow[^"]*">|<meta name="robots" content="noindex, nofollow">|' _site/index.html
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
