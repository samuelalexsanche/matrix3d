
# Publica el sitio estático en GitHub Pages en cada push a main.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar carpeta pública
        shell: bash
        run: |
          set -e

          mkdir -p _site

          # Archivos y carpetas del sitio
          cp -r index.html 404.html css js assets \
            llms.txt robots.txt sitemap.xml site.webmanifest _site/

          # Dominio personalizado
          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

          # Llave de verificación de IndexNow
          cp a1c2ef037518a886f5c0741424ba3bb0.txt _site/

          # No bloquear la indexación del sitio público.
          # Se conserva el robots.txt original del repositorio.

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
